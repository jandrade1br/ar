<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAR Outdoor (GPS)</title>

  <!-- Bibliotecas hospedadas localmente (pasta lib/) -->
  <script src="lib/aframe.min.js"></script>
  <script src="lib/aframe-ar-nft.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 16px system-ui, sans-serif; }
    #inicio { position: fixed; inset: 0; z-index: 10000; overflow-y: auto; padding: 20px;
              background: #10231a; color: #fff; }
    #inicio .caixa { max-width: 30rem; margin: 0 auto; }
    #inicio h1 { font-size: 1.3rem; margin: 0 0 8px; }
    #inicio p, #inicio label { font-size: .95rem; }
    #inicio label { display: block; margin: 14px 0 4px; font-weight: 600; }
    #inicio select, #inicio button { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 0; }
    #inicio select { background: #fff; color: #111; }
    #inicio button { background: #5fd49a; color: #06241a; margin-top: 16px; }
    #inicio .chk { display: flex; gap: 10px; align-items: center; font-weight: 400; }
    #inicio .chk input { width: 20px; height: 20px; }
    #inicio button:focus-visible, #inicio select:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px; color: #fff; display: none;
           background: rgba(0,0,0,.7); z-index: 9999; font-size: 14px; line-height: 1.4; }
    #hud .peq { opacity: .8; font-size: 12px; }
  </style>
</head>
<body>

  <div id="inicio">
    <div class="caixa">
      <h1>AR outdoor por GPS</h1>
      <p>Use em local aberto. Ao iniciar, permita câmera, localização e sensores de movimento.</p>

      <label for="selModo">Onde colocar o objeto</label>
      <select id="selModo">
        <option value="frente" selected>À frente de mim (direção em que o celular aponta ao iniciar)</option>
        <option value="norte">Ao norte da minha posição</option>
      </select>

      <label for="selDist">Distância do objeto</label>
      <select id="selDist">
        <option value="10">10 m</option>
        <option value="15" selected>15 m</option>
        <option value="25">25 m</option>
        <option value="50">50 m</option>
      </select>

      <label for="selPrec">Precisão mínima do GPS aceita</label>
      <select id="selPrec">
        <option value="1000" selected>Até 1000 m (teste em local fechado ou sinal fraco)</option>
        <option value="100">Até 100 m (padrão do AR.js)</option>
        <option value="30">Até 30 m (campo aberto)</option>
      </select>

      <label class="chk"><input type="checkbox" id="chkTeste" checked>
        Mostrar um cubo verde fixo na frente da câmera (verifica se o desenho 3D funciona)</label>

      <p class="peq">Para um ponto fixo, abra a página com <code>?lat=-1.3&amp;lon=-48.4</code>.</p>
      <button id="btn" type="button">Iniciar</button>
    </div>
  </div>

  <div id="hud" aria-live="polite">
    <div id="estado">Aguardando…</div>
    <div id="det" class="peq"></div>
    <div id="err" class="peq"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const RAD = Math.PI / 180;
    const esperar = ms => new Promise(r => setTimeout(r, ms));

    let rumoAtual = null;       // direção da câmera pela bússola do navegador (graus, 0 = norte)
    let pos = null;             // última posição do GPS {lat, lon, prec}
    let posInicial = null;      // posição ao iniciar (referência do objeto)
    let alvo = null;            // {lat, lon} do objeto
    let modoFixo = false;       // true quando o ponto vem da URL (?lat=&lon=)
    let precMinNum = 0, primeiroFeed = false;

    function estado(t) { $('estado').textContent = t; }

    // ---------- Erros (visíveis no painel e persistentes) ----------
    function registrarErro(m) {
      m = String(m || '');
      if (/message channel closed|Extension context|chrome-extension/i.test(m)) return;
      $('err').textContent = 'Último erro: ' + m.slice(0, 180);
    }
    window.addEventListener('error', e => registrarErro(e.message));
    window.addEventListener('unhandledrejection', e => registrarErro(e.reason && e.reason.message || e.reason));
    const consoleErroOriginal = console.error;
    console.error = (...args) => { registrarErro(args.join(' ')); consoleErroOriginal.apply(console, args); };

    // ---------- Geometria ----------
    function distancia(a, b) {                       // haversine, em metros
      const R = 6371000, dLat = (b.lat - a.lat) * RAD, dLon = (b.lon - a.lon) * RAD;
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    function rumoPara(a, b) {                        // azimute de a até b, em graus
      const y = Math.sin((b.lon - a.lon) * RAD) * Math.cos(b.lat * RAD);
      const x = Math.cos(a.lat * RAD) * Math.sin(b.lat * RAD) -
                Math.sin(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.cos((b.lon - a.lon) * RAD);
      return (Math.atan2(y, x) / RAD + 360) % 360;
    }
    function deslocar(p, metros, graus) {            // ponto a "metros" de p, na direção "graus"
      return {
        lat: p.lat + (metros * Math.cos(graus * RAD)) / 111320,
        lon: p.lon + (metros * Math.sin(graus * RAD)) / (111320 * Math.cos(p.lat * RAD))
      };
    }

    // ---------- Sensores de orientação ----------
    // O aplicativo lê os sensores e gira a câmera do A-Frame por conta própria (mesma matemática do AR.js).
    // Sem leituras dos sensores a câmera não gira e o objeto parece "colado" na tela.
    let ultimaOri = null;                            // {alpha, beta, gamma} em graus
    let eventosOri = 0, temAbsoluto = false;

    function rumoDaCamera(alpha, beta, gamma) {      // rumo da câmera traseira (fórmula do W3C)
      const x = (beta || 0) * RAD, y = (gamma || 0) * RAD, z = (alpha || 0) * RAD;
      const cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
      const Vx = -cZ * sY - sZ * sX * cY, Vy = -sZ * sY + cZ * sX * cY;
      let g = Math.atan(Vx / Vy);
      if (Vy < 0) g += Math.PI; else if (Vx < 0) g += 2 * Math.PI;
      return g / RAD;
    }
    function aoOrientar(e) {
      eventosOri++;
      const absoluto = e.type === 'deviceorientationabsolute' || e.absolute === true;
      if (absoluto) temAbsoluto = true;
      if (!absoluto && temAbsoluto) return;          // depois que chegam leituras absolutas, ignora as relativas
      if (e.alpha == null && e.beta == null && e.gamma == null) return;
      ultimaOri = { alpha: e.alpha || 0, beta: e.beta || 0, gamma: e.gamma || 0 };
      if (e.webkitCompassHeading !== undefined) rumoAtual = e.webkitCompassHeading;
      else if (absoluto) {
        const g = rumoDaCamera(ultimaOri.alpha, ultimaOri.beta, ultimaOri.gamma);   // indefinido com o celular deitado
        if (Number.isFinite(g)) rumoAtual = g;
      }
    }

    // Gira a entidade da câmera conforme os sensores (mesma matemática do DeviceOrientationControls do three.js)
    AFRAME.registerComponent('orientacao-propria', {
      init() {
        const T = AFRAME.THREE;
        this.euler = new T.Euler(); this.q0 = new T.Quaternion();
        this.q1 = new T.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); this.eixoZ = new T.Vector3(0, 0, 1);
      },
      tick() {
        if (!ultimaOri) return;
        const tela = (screen.orientation && typeof screen.orientation.angle === 'number')
                       ? screen.orientation.angle : (window.orientation || 0);
        this.euler.set(ultimaOri.beta * RAD, ultimaOri.alpha * RAD, -ultimaOri.gamma * RAD, 'YXZ');
        const q = this.el.object3D.quaternion;
        q.setFromEuler(this.euler);
        q.multiply(this.q1);
        q.multiply(this.q0.setFromAxisAngle(this.eixoZ, -tela * RAD));
      }
    });

    // ---------- Acesso aos componentes do AR.js ----------
    const camEl = () => document.querySelector('a-camera');
    const compGps = () => { const c = camEl(); return c && c.components && c.components['gps-new-camera']; };

    const orientacaoRecebida = () => ultimaOri !== null;      // os sensores já enviaram leituras?
    // Direção para onde a câmera do próprio AR.js aponta (0 = norte). É a referência usada para colocar o objeto.
    function rumoDoARjs() {
      const c = camEl() && camEl().getObject3D('camera');
      if (!c) return null;
      const v = c.getWorldDirection(new AFRAME.THREE.Vector3());
      if (Math.hypot(v.x, v.z) < 0.35) return null;  // celular quase deitado: direção indefinida
      return (Math.atan2(v.x, -v.z) / RAD + 360) % 360;
    }

    // Entrega a posição ao AR.js. O monitor de GPS interno do AR.js é desligado (veja montar),
    // então a câmera só se move quando recebe a posição por aqui.
    function alimentarARjs(p, forcar) {
      const comp = compGps();
      if (!comp || !p) return;
      const limite = modoFixo ? precMinNum : Math.min(precMinNum, 50);
      if (forcar || p.prec <= limite) comp.threeLoc.fakeGps(p.lon, p.lat);
    }

    // ---------- GPS ----------
    function obterPosicao() {
      return new Promise((ok, erro) => navigator.geolocation.getCurrentPosition(
        p => ok({ lat: p.coords.latitude, lon: p.coords.longitude, prec: p.coords.accuracy }),
        erro, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }));
    }

    // ---------- Início ----------
    $('btn').addEventListener('click', async () => {
      // iOS 13+ exige permissão explícita para a bússola, dentro do gesto do usuário
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* segue sem bússola */ }
      }
      window.addEventListener('deviceorientationabsolute', aoOrientar, true);
      window.addEventListener('deviceorientation', aoOrientar, true);
      $('inicio').style.display = 'none';
      $('hud').style.display = 'block';
      estado('Obtendo GPS…');

      try { pos = await obterPosicao(); }
      catch (e) { estado('GPS indisponível: ' + e.message + '. Ative a localização e use HTTPS.'); return; }
      posInicial = Object.assign({}, pos);
      modoFixo = params.has('lat') && params.has('lon');
      precMinNum = Number($('selPrec').value);

      navigator.geolocation.watchPosition(
        p => {
          pos = { lat: p.coords.latitude, lon: p.coords.longitude, prec: p.coords.accuracy };
          if (primeiroFeed) alimentarARjs(pos, false);
        },
        e => registrarErro('GPS: ' + e.message), { enableHighAccuracy: true });

      criarCena($('chkTeste').checked);
      setInterval(atualizarPainel, 500);
      setTimeout(() => {
        if (!eventosOri) registrarErro('Os sensores de movimento não enviaram dados. Permita "Sensores de movimento" nas configurações do site e recarregue a página.');
      }, 3000);
    });

    function criarCena(teste) {
      // Primeiro só a câmera GPS, vazia. Os objetos são criados depois (ordem exigida pelo AR.js).
      document.body.insertAdjacentHTML('beforeend', `
        <a-scene vr-mode-ui="enabled: false"
                 arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
                 renderer="antialias: true; alpha: true">
          <a-camera gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 100000"></a-camera>
        </a-scene>`);
      const cena = document.querySelector('a-scene');
      const iniciar = () => montar(cena, teste).catch(e => registrarErro('montar: ' + (e && e.message || e)));
      if (cena.hasLoaded) iniciar(); else cena.addEventListener('loaded', iniciar, { once: true });
    }

    async function montar(cena, teste) {
      for (let i = 0; i < 30 && !compGps(); i++) await esperar(100);
      const comp = compGps();
      if (!comp) { registrarErro('O componente gps-new-camera não foi inicializado.'); return; }

      // Desliga o monitor de GPS do AR.js (ele descarta leituras acima do limite de precisão e pode falhar
      // em silêncio) e passa a alimentá-lo com a leitura própria.
      comp.threeLoc.stopGps();
      comp.threeLoc.startGps = () => false;

      // A câmera passa a ser girada pelo controle de orientação deste aplicativo
      const cam = camEl();
      cam.removeAttribute('arjs-device-orientation-controls');
      cam.setAttribute('look-controls', 'enabled', false);
      cam.setAttribute('orientacao-propria', '');
      alimentarARjs(modoFixo ? pos : posInicial, true);
      primeiroFeed = true;

      if (teste) {
        camEl().insertAdjacentHTML('beforeend',
          '<a-box position="0 -0.3 -2" scale="0.3 0.3 0.3" material="color: #3ae05f"></a-box>');
      }

      // Define onde fica o objeto
      let origem = '';
      if (modoFixo) {
        alvo = { lat: parseFloat(params.get('lat')), lon: parseFloat(params.get('lon')) };
        origem = 'Ponto fixo da URL.';
      } else {
        let graus = 0;
        origem = 'Objeto ao norte.';
        if ($('selModo').value === 'frente') {
          estado('Aguardando os sensores de movimento… segure o celular na vertical.');
          for (let i = 0; i < 25 && !orientacaoRecebida(); i++) await esperar(200);
          await esperar(300);                                   // deixa a câmera receber a orientação
          const h = orientacaoRecebida() ? rumoDoARjs() : null;
          if (h !== null) { graus = h; origem = 'Objeto colocado à frente, na direção da câmera.'; }
          else if (!orientacaoRecebida()) origem = 'Os sensores não enviaram dados: objeto colocado ao norte e a câmera não vai girar.';
          else origem = 'Celular na horizontal ou sem direção: objeto colocado ao norte. Segure na vertical e reinicie.';
        }
        alvo = deslocar(posInicial, Number($('selDist').value), graus);
      }
      registrarOrigem(origem);

      cena.insertAdjacentHTML('beforeend', `
        <a-entity id="ponto" geometry="primitive: box" material="color: #e0453a" scale="6 6 6"
                  gps-new-entity-place="latitude: ${alvo.lat}; longitude: ${alvo.lon}"></a-entity>
        <a-text value="Ponto A" align="center" color="#ffffff" width="30" look-at="[gps-new-camera]"
                gps-new-entity-place="latitude: ${alvo.lat}; longitude: ${alvo.lon}" position="0 7 0"></a-text>`);
    }
    let textoOrigem = '';
    function registrarOrigem(t) { textoOrigem = t; }

    // ---------- Painel de diagnóstico ----------
    const f = n => (Math.round(n * 10) / 10).toString();

    function atualizarPainel() {
      if (!pos) return;
      const v = document.querySelector('video');
      const cameraOk = !!(v && v.readyState >= 2);
      const comp = compGps(), cam = camEl();
      const gpsAR = !!(comp && comp._currentPosition);
      const entidades = [...document.querySelectorAll('[gps-new-entity-place]')]
                          .filter(el => el.components && el.components['gps-new-entity-place']).length;
      const ponto = document.getElementById('ponto');
      const rumoAR = rumoDoARjs();

      let msg = textoOrigem || 'Iniciando…';
      if (alvo) {
        const d = distancia(pos, alvo), r = rumoPara(pos, alvo);
        const ref = rumoAR !== null ? rumoAR : rumoAtual;
        let orient = 'sem direção';
        if (ref !== null) {
          const rel = ((r - ref + 540) % 360) - 180;       // -180..180 (positivo = à direita)
          orient = Math.abs(rel) < 10 ? 'objeto à frente'
                 : 'vire ' + Math.round(Math.abs(rel)) + '° para a ' + (rel > 0 ? 'direita' : 'esquerda');
        }
        msg = 'Objeto a ' + Math.round(d) + ' m · ' + orient;
      }
      estado(msg);

      let mundo = '';
      if (cam && ponto && gpsAR) {
        const dx = ponto.object3D.position.x - cam.object3D.position.x, dz = ponto.object3D.position.z - cam.object3D.position.z;
        mundo = ` · No AR.js, objeto a ${Math.round(Math.hypot(dx, dz))} m`;
      }
      $('det').textContent =
        `GPS ±${Math.round(pos.prec)} m · Bússola ${rumoAtual === null ? '—' : Math.round(rumoAtual) + '°'}` +
        ` · Câmera 3D: direção ${rumoAR === null ? '—' : Math.round(rumoAR) + '°'}` +
        ` · Sensores: ${eventosOri} leituras${temAbsoluto ? ' (absolutas)' : (eventosOri ? ' (relativas: o norte não é confiável)' : '')}` +
        ` · Câmera ${cameraOk ? 'ok' : 'aguardando'} · Posição ${gpsAR ? 'ok' : 'aguardando'} · Objetos ${entidades}/2` + mundo;
    }
  </script>
</body>
</html>
