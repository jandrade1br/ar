<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo WebAR</title>
  <style>
    :root { color-scheme: light dark; --fundo:#f5f7f4; --texto:#16231b; --destaque:#1f6f4a; --borda:#c9d3cc; }
    @media (prefers-color-scheme: dark) { :root { --fundo:#121a15; --texto:#e6efe9; --destaque:#5fd49a; --borda:#2c3a31; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 20px; background:var(--fundo); color:var(--texto);
           font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width:36rem; margin-inline:auto; }
    h1 { font-size:1.5rem; margin:0 0 .25rem; }
    p  { margin:.25rem 0 1.25rem; }
    a.modo { display:block; padding:16px; margin-bottom:12px; border:1px solid var(--borda);
             border-radius:10px; color:inherit; text-decoration:none; }
    a.modo strong { display:block; color:var(--destaque); font-size:1.1rem; }
    a.modo:focus-visible, a.modo:hover { border-color:var(--destaque); outline:none; }
    small { opacity:.75; }
  </style>
</head>
<body>
  <h1>Protótipo WebAR</h1>
  <p>Escolha o modo de teste. A página precisa estar em HTTPS para o navegador liberar câmera e GPS.</p>

  <a class="modo" href="outdoor.html">
    <strong>Outdoor (GPS)</strong>
    Objeto 3D ancorado em coordenadas geográficas.
  </a>
  <a class="modo" href="indoor.html">
    <strong>Indoor (marcadores)</strong>
    Objeto 3D ancorado em marcadores impressos ou exibidos em outra tela.
  </a>
  <small>AR.js 3.4.5 + A-Frame 1.3.0</small>
</body>
</html>
