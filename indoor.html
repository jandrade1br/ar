<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebAR Indoor (marcadores)</title>

  <!-- Bibliotecas e dados hospedados localmente (pastas lib/ e data/), sem depender de CDNs -->
  <script src="lib/aframe.min.js"></script>
  <script src="lib/aframe-ar.js"></script>

  <style>
    /* Sem background e sem height em html/body: o AR.js insere o <video> da câmera atrás da cena
       e controla o tamanho dele; um fundo opaco o esconderia. */
    body { margin: 0; overflow: hidden; font: 16px system-ui, sans-serif; }
    #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px; color: #fff;
           background: rgba(0,0,0,.7); z-index: 9999; font-size: 14px; }
  </style>
</head>
<body>
  <div id="hud" aria-live="polite">Iniciando a câmera…</div>

  <!-- cameraParametersUrl e os marcadores (type="pattern") apontam para arquivos locais -->
  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false; cameraParametersUrl: data/camera_para.dat;">

    <!-- Ambiente A: marcador Hiro -->
    <a-marker id="salaA" type="pattern" url="data/patt.hiro">
      <a-box position="0 0.5 0" material="color: #f2c230"></a-box>
    </a-marker>

    <!-- Ambiente B: marcador Kanji -->
    <a-marker id="salaB" type="pattern" url="data/patt.kanji">
      <a-sphere position="0 0.6 0" radius="0.6" material="color: #3aa0e0"></a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const hud = document.getElementById('hud');
    const aguardando = 'Aponte a câmera para um marcador (Hiro ou Kanji).';
    let iniciou = false;

    // 1) Contexto seguro (HTTPS) é obrigatório para a câmera
    if (!window.isSecureContext) {
      hud.textContent = 'Página fora de HTTPS: o navegador bloqueia a câmera.';
    }

    // 2) Verifica se os arquivos de dados estão acessíveis neste servidor
    ['data/camera_para.dat', 'data/patt.hiro', 'data/patt.kanji'].forEach(url => {
      fetch(url, { method: 'GET', cache: 'no-store' })
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
        .catch(e => { hud.textContent = 'Arquivo não encontrado: ' + url + ' (' + e.message + '). Envie a pasta data/ ao servidor.'; });
    });

    // 3) Exibe erros reais do código (ignora ruído de extensões do navegador)
    const ruido = /message channel closed|Extension context|chrome-extension/i;
    window.addEventListener('error', e => {
      if (!ruido.test(e.message || '')) hud.textContent = 'Erro: ' + e.message;
    });
    window.addEventListener('unhandledrejection', e => {
      const msg = (e.reason && (e.reason.message || e.reason)) + '';
      if (!ruido.test(msg)) hud.textContent = 'Erro: ' + msg;
    });

    window.addEventListener('camera-init', () => { iniciou = true; hud.textContent = aguardando; });
    window.addEventListener('camera-error', e => {
      hud.textContent = 'Erro de câmera: ' + ((e.detail && (e.detail.message || e.detail.code)) || 'verifique a permissão');
    });
    setTimeout(() => { if (!iniciou && hud.textContent === 'Iniciando a câmera…') hud.textContent = aguardando; }, 5000);

    // 4) Eventos dos marcadores
    [['salaA', 'Sala A'], ['salaB', 'Sala B']].forEach(([id, nome]) => {
      const m = document.getElementById(id);
      m.addEventListener('markerFound', () => { hud.textContent = 'Marcador detectado: ' + nome; });
      m.addEventListener('markerLost',  () => { hud.textContent = aguardando; });
    });
  </script>
</body>
</html>
